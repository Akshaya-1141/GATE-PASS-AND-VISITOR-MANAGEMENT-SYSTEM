<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Management System - Login</title>
    <!-- Tailwind CSS for modern, clean UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-200 text-center">
        <!-- Logo / Security Shield Icon -->
        <div class="mx-auto w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mb-4 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
        </div>

        <!-- System Title & Subheading -->
        <h1 class="text-2xl font-bold text-slate-800 mb-1">Visitor Gate Pass System</h1>
        <p class="text-sm text-slate-500 mb-6">Cloud-Based Campus Security & Appointment Management</p>

        <!-- Dynamic Notification Alert Box -->
        <div id="alertBox" class="hidden mb-4 p-3.5 rounded-lg text-sm text-left font-medium"></div>

        <!-- Google Sign-In Button -->
        <button id="googleBtn" onclick="handleGoogleSignIn()" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-xl shadow-sm transition duration-150 ease-in-out disabled:opacity-50">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span id="btnText">Sign in with Google</span>
        </button>

        <p class="text-xs text-slate-400 mt-6">
            Authorized Personnel Only (Admin, Security, & Staff)
        </p>
    </div>

    <script>
        // Initialize Firebase with configuration passed from Flask backend
        const firebaseConfig = JSON.parse('{{ firebase_config | tojson | safe }}');
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-green-50', 'text-green-700', 'border-green-200');
            
            if (type === 'error') {
                alertBox.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
            } else {
                alertBox.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-200');
            }
            
            alertBox.innerText = message;
        }

        async function handleGoogleSignIn() {
            const googleBtn = document.getElementById('googleBtn');
            const btnText = document.getElementById('btnText');
            
            googleBtn.disabled = true;
            btnText.innerText = "Authenticating...";

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;

                // Send Google credentials to Flask backend for role checking
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: user.email,
                        name: user.displayName
                    })
                });

                const resData = await response.json();

                if (resData.status === 'success') {
                    showAlert("Authentication successful! Redirecting...", "success");
                    window.location.href = resData.redirect;
                } else {
                    showAlert(resData.message || "Access Denied: User not registered in database.", "error");
                    auth.signOut(); // Sign out from Firebase if backend rejects access
                    googleBtn.disabled = false;
                    btnText.innerText = "Sign in with Google";
                }
            } catch (error) {
                console.error("Login Error:", error);
                showAlert(error.message || "Sign-in failed. Please try again.", "error");
                googleBtn.disabled = false;
                btnText.innerText = "Sign in with Google";
            }
        }
    </script>
</body>
</html>
